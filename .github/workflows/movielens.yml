name: MovieLens reproduction

# The full benchmark downloads MovieLens-100K from GroupLens and takes several minutes, so it runs
# weekly and on demand rather than on every push. It checks the README's numbers within stated
# tolerances and its qualitative claims (scripts/check_claims.py) and keeps the fresh report.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download MovieLens-100K (SHA-256 checked) and run the full benchmark
        run: |
          recsys-lab download --dest data
          recsys-lab run --data-dir data --out runs/movielens_100k.json
      - name: Check the README's claims
        run: python scripts/check_claims.py runs/movielens_100k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movielens-report
          path: runs/movielens_100k.json
