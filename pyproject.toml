[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-ranking-lab"
version = "1.0.0"
description = "Two-stage recommendation on MovieLens-100K: popularity, ItemKNN and implicit ALS retrieval, merged candidates, and learned rankers trained with random versus hard negatives, evaluated by full-catalogue leave-last-out."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
recsys-lab = "recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
